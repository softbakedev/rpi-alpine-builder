name: Build and Release rpialp-desktop

on:
  # Triggers on pushes to main and desktop-client
  push:
    branches:
      - main
      - desktop-client
    tags:
      - 'v*.*.*'  # e.g. v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.6']  # Adjust as needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2@latest
          echo "::add-path::$(go env GOPATH)/bin"

      - name: Build Wails App
        run: |
          # Clean build: remove existing 'build' dir, then compile
          wails build \
            -clean \
            -o rpialp-desktop

          # Rename the final binary based on OS
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows produces rpialp-desktop.exe by default
            mv rpialp-desktop.exe rpialp-desktop-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv rpialp-desktop rpialp-desktop-macos
          else
            mv rpialp-desktop rpialp-desktop-linux
          fi

      - name: Upload Raw Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpialp-desktop-${{ matrix.os }}
          path: |
            rpialp-desktop-windows.exe
            rpialp-desktop-macos
            rpialp-desktop-linux
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpialp-desktop-windows
          path: ./artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpialp-desktop-macos
          path: ./artifacts/macos

      - name: Download Linux Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpialp-desktop-linux
          path: ./artifacts/linux

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "rpialp-desktop Release ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/rpialp-desktop-windows.exe
          asset_name: rpialp-desktop-windows.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/rpialp-desktop-macos
          asset_name: rpialp-desktop-macos
          asset_content_type: application/octet-stream

      - name: Upload Linux Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/rpialp-desktop-linux
          asset_name: rpialp-desktop-linux
          asset_content_type: application/octet-stream