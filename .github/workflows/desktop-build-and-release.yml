name: Build and Release rpialp-desktop

on:
  # Triggers on pushes to main and desktop-client
  push:
    branches:
      - main
      - desktop-client
    tags:
      - 'v*.*.*'  # e.g. v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        go-version: ['1.22.6']  # Adjust as needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 23.3.0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt install libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build web client
        run: |
          npm install next@latest react@latest react-dom@latest
          cd desktop/frontend
          npm install
          npm run build

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: bash
        run: |
          cd desktop
          # Rename the final binary based on OS
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            wails build -platform windows -clean -webview2 download
            mv build/bin/rpi-alpine-builder.exe build/bin/rpi-alpine-builder-desktop-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            wails build -platform darwin/universal -webview2 download -clean
            mv build/bin/rpi-alpine-builder.app/Contents/MacOS/rpi-alpine-builder build/bin/rpi-alpine-builder.app/Contents/MacOS/rpi-alpine-builder-desktop-macos
          else
            wails build -tags webkit2_41 -clean -webview2 download
            mv build/bin/rpi-alpine-builder build/bin/rpi-alpine-builder-desktop-linux
          fi

#      - name: Create macOS DMG
#        if: matrix.os == 'macos-latest'
#        run: |
#
#          xattr -rc "/Users/runner/work/rpi-alpine-builder/rpi-alpine-builder/desktop/build/bin/rpi-alpine-builder.app"
#
#          hdiutil create \
#            -volname "rpi-alpine-builder" \
#            -srcfolder "/Users/runner/work/rpi-alpine-builder/rpi-alpine-builder/desktop/build/bin/rpi-alpine-builder.app" \
#            -ov \
#            -format UDZO "rpi-alpine-builder-macos.dmg"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: rpi-alpine-builder-dekstop-macos
          path: |
            desktop/build/bin/rpi-alpine-builder.app/Contents/MacOS/rpi-alpine-builder-desktop-macos
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: rpi-alpine-builder-desktop-windows
          path: |
            desktop/build/bin/rpi-alpine-builder-desktop-windows.exe
          if-no-files-found: error


      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: rpi-alpine-builder-desktop-linux
          path: |
            desktop/build/bin/rpi-alpine-builder-desktop-linux
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpi-alpine-builder-windows
          path: ./artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpi-alpine-builder-macos
          path: ./artifacts/macos

      - name: Download Linux Artifact
        uses: actions/download-artifact@v3
        with:
          name: rpi-alpine-builder-ubuntu
          path: ./artifacts/linux

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "rpi-alpine-builder Release ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/rpi-alpine-builder-windows.exe
          asset_name: rpi-alpine-builder-windows.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS DMG
        uses: actions/upload-release-asset@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/rpi-alpine-builder-macos
          asset_name: rpi-alpine-builder-macos.dmg
          asset_content_type: application/octet-stream

      - name: Upload Linux Binary
        uses: actions/upload-release-asset@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/rpi-alpine-builder-linux
          asset_name: rpi-alpine-builder-linux
          asset_content_type: application/octet-stream